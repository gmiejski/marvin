[package]
name        = "marvin"
version     = "0.1.0"
edition     = "2024"
description = "Most Annoying Remote VDI Input Nuisance - a keyboard-simulation tool for pasting scripts into clipboard-restricted VDI environments."
license     = "BSD-3-Clause"

[dependencies]
eframe     = "0.34"
enigo      = "0.6"
thiserror  = "2"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6"
objc2-app-kit    = { version = "0.3", features = ["NSApplication", "NSWindow", "NSResponder"] }
objc2-foundation = "0.3"
core-graphics    = "0.25"
core-foundation  = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
